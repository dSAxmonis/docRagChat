# Render Blueprint: one Docker web service (API + built frontend) and one Postgres database.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. You will be prompted for GEMINI_API_KEY.
services:
  - type: web
    name: doc-rag-chatbot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doc-rag-db
          property: connectionString
      # Internal Render network; TLS is not required
      - key: DATABASE_SSL
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIM
        value: "768"
      - key: CHAT_RATE_LIMIT_PER_MIN
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "5"

databases:
  - name: doc-rag-db
    plan: free
    region: singapore
    databaseName: rag
    user: rag
    postgresMajorVersion: "16"
