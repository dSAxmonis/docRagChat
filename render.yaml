# Render Blueprint: one Docker web service (API + built frontend).
# Postgres + pgvector is external (Neon free tier), because Render allows one free database per workspace.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. You will be prompted for DATABASE_URL and GEMINI_API_KEY.
services:
  - type: web
    name: doc-rag-chatbot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon pooled connection string (host contains -pooler), ?sslmode=verify-full
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string, used only for migrations
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # TLS settings come from sslmode in the URLs
      - key: DATABASE_SSL
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODELS
        value: gemini-flash-lite-latest,gemini-flash-latest,gemini-3.8-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIM
        value: "768"
      # Cloudflare edge + Render load balancer sit in front of the app
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: CHAT_RATE_LIMIT_PER_MIN
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "5"

